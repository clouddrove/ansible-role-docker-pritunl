---

- name: Create pritunl dirs
  ansible.builtin.file:
    path: "{{item|safe|trim}}"
    state: directory
    owner: "{{pritunl_user}}"
    group: "{{pritunl_group}}"
    mode: 0755
    recurse: true
  with_items:
    - "{{pritunl_path}}"

- name: Create pritunl mongo dirs
  ansible.builtin.file:
    path: "{{item|safe|trim}}"
    state: directory
    owner: "{{mongo_user}}"
    group: "{{mongo_group}}"
    mode: 0755
    recurse: true
  with_items:
    - "{{mongo_path}}"

- name: Transfer pritunl.conf
  ansible.builtin.template:
    mode: "0644"
    dest: "{{pritunl_path}}/pritunl.conf"
    src: "{{item}}"
  with_items:
    - config/pritunl.conf

- name: Create pritunl log
  ansible.builtin.shell:
    cmd: touch {{pritunl_log}}
