---

- name: Restart pritunl
  ansible.builtin.service:
    name: Pritunl
    state: restarted
    enabled: true

- name: Reload pritunl
  ansible.builtin.service:
    name: Pritunl
    state: reloaded
    enabled: true

- name: Start pritunl
  ansible.builtin.service:
    name: Pritunl
    state: started
    enabled: true
